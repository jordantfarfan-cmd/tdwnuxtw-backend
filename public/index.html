<body>
    <div class="main-layout">
        <div class="sidebar-ads">
            <div class="ad-placeholder">
                <span style="margin-bottom: 10px;">Publicidad Adsterra</span>
                <p style="font-size: 8px; opacity: 0.5; margin: 0 10px; text-align: center;">Pega aquí tu código de banner (160x600)</p>
                
                <!-- ESPACIO PARA TU CÓDIGO DE ADSTERRA -->
                <div id="adsterra-banner">
                    <script type="text/javascript">
                        atOptions = {
                            'key' : '57216caf2adec9b4b95f617aea56f46b',
                            'format' : 'iframe',
                            'height' : 600,
                            'width' : 160,
                            'params' : {}
                        };
                    </script>
                    <script type="text/javascript" src="https://www.highperformanceformat.com/57216caf2adec9b4b95f617aea56f46b/invoke.js"></script>
                </div>
            </div>
        </div>

        <div class="container">
            <h1>TDwnuXTw ®</h1>
            <h3>Adquisidor de videos multiplataforma</h3>

            <div id="linksContainer"></div>

            <div class="input-group">
                <p style="margin: 0 0 5px 0; font-size: 0.9em; color: #ccc;">🔗 Pega tus enlaces aquí (uno o varios):</p>
                <textarea id="urlInput" placeholder="https://..." oninput="autoResize(this)"
                    onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); addLink(); }"></textarea>
            </div>
        </div>
    </div>

    <script>
        let links = [];

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        // Manejar el pegado para separar links visualmente con saltos de línea
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('urlInput');
            input.addEventListener('paste', function (e) {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text');
                const formatted = text.split(/[\s,]+/).filter(u => u.trim()).join('\n');
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + formatted + this.value.substring(end);
                autoResize(this);
            });
        });

        function getPlatformInfo(url) {
            const u = url.toLowerCase();
            if (u.includes('youtube.com') || u.includes('youtu.be')) return { class: 'bg-youtube', textClass: 'text-youtube', icon: 'https://i.imgur.com/xKR2e4J.png', name: 'YouTube' };
            if (u.includes('facebook.com') || u.includes('fb.watch') || u.includes('fb.com')) return { class: 'bg-facebook', textClass: 'text-facebook', icon: 'https://i.imgur.com/KfqJ0SE.png', name: 'Facebook' };
            if (u.includes('instagram.com')) return { class: 'bg-instagram', textClass: 'text-instagram', icon: 'https://i.imgur.com/dRcDOwS.png', name: 'Instagram' };
            if (u.includes('tiktok.com')) return { class: 'bg-tiktok', textClass: 'text-tiktok', icon: 'https://i.imgur.com/LFzL7OA.png', name: 'TikTok' };
            if (u.includes('twitter.com') || u.includes('x.com')) return { class: 'bg-x', textClass: 'text-x', icon: 'https://i.imgur.com/QVitgr8.png', name: 'X' };
            return { class: 'bg-youtube', textClass: '', icon: '🌐', name: 'Web' }; // Default
        }

        // Detectar si estamos en local o en producción
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const BACKEND_URL = isLocal ? 'http://127.0.0.1:8000' : 'https://tdwnuxtw-backend.onrender.com';

        function formatDuration(sec) {
            if (!sec) return "";
            const hrs = Math.floor(sec / 3600);
            const mins = Math.floor((sec % 3600) / 60);
            const secs = Math.floor(sec % 60);
            let ret = "";
            if (hrs > 0) ret += "" + hrs + ":" + (mins < 10 ? "0" : "");
            ret += "" + mins + ":" + (secs < 10 ? "0" : "");
            ret += "" + secs;
            return ret;
        }

        function estimateSize(durationSecs, format, quality, platform = '') {
            if (!durationSecs || durationSecs <= 0) return "";

            let bitrateKbps = 0;
            if (format === 'Audio') {
                if (quality.includes('320')) bitrateKbps = 320;
                else if (quality.includes('256')) bitrateKbps = 256;
                else if (quality.includes('128')) bitrateKbps = 128;
                else bitrateKbps = 128;
            } else {
                const p = platform.toLowerCase();
                const isMobile = p.includes('tiktok') || p.includes('instagram') || p.includes('facebook');

                // Reducir la estimación significativamente para redes sociales que comprimen el video
                const base1080 = isMobile ? 1800 : 3500;
                const base720 = isMobile ? 1200 : 2000;
                const base480 = isMobile ? 600 : 1000;
                const base360 = isMobile ? 400 : 700;
                const base240 = isMobile ? 250 : 400;

                if (quality.includes('1080p') || quality.includes('HD')) bitrateKbps = base1080;
                else if (quality.includes('720p')) bitrateKbps = base720;
                else if (quality.includes('480p')) bitrateKbps = base480;
                else if (quality.includes('360p')) bitrateKbps = base360;
                else if (quality.includes('240p')) bitrateKbps = base240;
                else if (quality.includes('144p')) bitrateKbps = 150;
                else bitrateKbps = base720;
            }

            let sizeMB = (bitrateKbps * durationSecs) / 8192;
            if (sizeMB < 1) return (sizeMB * 1024).toFixed(0) + " KB";
            if (sizeMB > 1024) return (sizeMB / 1024).toFixed(2) + " GB";
            return sizeMB.toFixed(1) + " MB";
        }

        async function addLink() {
            const urlInput = document.getElementById('urlInput');
            const rawText = urlInput.value.trim();
            if (!rawText) return;
            urlInput.value = "";
            autoResize(urlInput);

            // Separar por espacios, comas o saltos de línea y filtrar solo URLs válidas
            const urls = rawText.split(/[\s,]+/).filter(u => u.startsWith('http'));

            if (urls.length === 0) return;

            for (const url of urls) {
                // Evitar duplicados en la lista actual
                if (links.find(l => l.url === url)) continue;

                const id = Date.now() + Math.random();
                const plat = getPlatformInfo(url);

                const linkData = {
                    id: id, url: url, title: "Cargando info...", thumb: "https://placehold.co/150x100/000000/FFFFFF/png?text=Cargando", duration: "", rawDuration: 0, plat: plat, state: "ready", logs: ["✅ Enlace capturado"],
                    format: null, // No pre-seleccionado
                    vidQuality: null,
                    audQuality: null
                };
                links.push(linkData);
                renderLinks();

                // Scroll automático
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);

                // Obtener info en segundo plano para cada link
                fetchLinkInfo(id);
            }
        }

        async function fetchLinkInfo(id) {
            const index = links.findIndex(l => l.id === id);
            if (index === -1) return;
            const link = links[index];

            if (link.infoError) {
                link.infoError = false;
                link.title = "Cargando info...";
                link.thumb = "https://placehold.co/150x100/000000/FFFFFF/png?text=Cargando";
                link.logs.push("⏳ Reintentando extracción...");
                renderLinks();
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/info`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link.url, format: "Video", quality: "1080p" })
                });

                if (res.ok) {
                    const info = await res.json();
                    link.title = info.title;
                    if (info.thumbnail && info.thumbnail.startsWith('/api/')) {
                        link.thumb = BACKEND_URL + info.thumbnail;
                    } else {
                        link.thumb = info.thumbnail;
                    }
                    link.duration = formatDuration(info.duration);
                    link.rawDuration = info.duration || 0;
                    if (info.status === "error") {
                        link.infoError = true;
                        link.logs.push("⚠️ Error en extracción");
                    } else {
                        link.infoError = false;
                        link.logs.push("✅ Información extraída");
                    }
                    renderLinks();
                } else {
                    link.infoError = true;
                    link.title = "⚠️ Error de servidor (500)";
                    link.logs.push("❌ El servidor no respondió correctamente");
                    renderLinks();
                }
            } catch (e) {
                console.error("Error API Info", e);
                link.infoError = true;
                link.title = "⚠️ Error de conexión";
                link.logs.push("❌ No se pudo conectar con el servidor");
                renderLinks();
            }
        }

        function toggleFormat(id, format) {
            const index = links.findIndex(l => l.id === id);
            if (index !== -1) {
                // Si ya estaba seleccionado el mismo, no hacemos nada
                if (links[index].format === format) return;

                links[index].format = format;
                links[index].isNewSelection = true; // Marcar para animar solo este cambio
                
                if (links[index].state === 'completed' || links[index].state === 'error') {
                    links[index].state = 'ready';
                    links[index].downloadUrl = null;
                }

                renderLinks();
            }
        }

        async function processLink(id) {
            const index = links.findIndex(l => l.id === id);
            if (index === -1) return;

            const link = links[index];
            link.state = "processing";
            const format = document.querySelector(`input[name="fmt_${id}"]:checked`).value;
            const isVideo = format === 'Video';

            // Leer del dropdown personalizado
            const trigger = isVideo ?
                document.querySelector(`.card[data-id="${id}"] .option-row[data-type="Video"] .dropdown-trigger`) :
                document.querySelector(`.card[data-id="${id}"] .option-row[data-type="Audio"] .dropdown-trigger`);

            const quality = trigger.dataset.value;

            link.logs.push("⚙️ Conectando con servidor en la nube...");
            link.logs.push(`⚡ Solicitando ${format} en ${quality}`);
            renderLinks();

            // Pseudo-real-time feedback
            let pseudoInterval = setInterval(() => {
                const msgs = ["⚡ Analizando manifiestos", "⚡ Bypasseando protecciones", "⚡ Descargando fragmentos", "⚡ Uniendo con FFmpeg"];
                link.logs.push(msgs[Math.floor(Math.random() * msgs.length)]);
                renderLinks();
            }, 8000);

            try {
                const res = await fetch(`${BACKEND_URL}/api/download`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link.url, format: format, quality: quality })
                });
                clearInterval(pseudoInterval);

                if (res.ok) {
                    // Recibir archivo como blob
                    const blob = await res.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);

                    const contentDisposition = res.headers.get('Content-Disposition');
                    let filename = `TDwnuXTw_Download.${format === 'Video' ? 'mp4' : 'mp3'}`;
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename="?([^"]+)"?/);
                        if (filenameMatch && filenameMatch.length === 2) filename = filenameMatch[1];
                    }

                    link.state = "completed";
                    link.downloadUrl = downloadUrl;
                    link.filename = filename;
                    link.logs.push("✅ Descarga finalizada (100%)");
                } else {
                    link.state = "ready";
                    link.logs.push("❌ Error al procesar");
                }
            } catch (e) {
                clearInterval(pseudoInterval);
                link.state = "ready";
                link.logs.push("⚠️ Falló conexión con servidor");
            }
            renderLinks();
        }

        function downloadFile(id) {
            const link = links.find(l => l.id === id);
            if (link && link.downloadUrl) {
                const a = document.createElement('a');
                a.href = link.downloadUrl;
                a.download = link.filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
            }
        }

        function renderLinks() {
            const container = document.getElementById('linksContainer');
            container.innerHTML = "";

            links.forEach(link => {
                const isFormatSelected = link.format === "Video" || link.format === "Audio";

                let actionBtn = "";
                if (!isFormatSelected) {
                    if (link.state === "ready") {
                        actionBtn = `<div class="btn-disabled" style="font-size: 10px; text-align: center; color: rgba(255,255,255,0.4); padding: 5px;">⚠️ Selecciona formato</div>`;
                    } else if (link.state === "error") {
                        actionBtn = `<button class="btn" style="font-size: 11px; padding: 6px; background: #dc3545;" onclick="retryLink(${link.id})">🔄 Reintentar</button>`;
                    }
                }

                let step3Btn = '';
                if (link.state === 'ready') {
                    step3Btn = `<button class="process-badge" onclick="processLink(${link.id})">▶ Procesar</button>`;
                } else if (link.state === 'processing') {
                    step3Btn = `<button class="process-badge processing" disabled>⚙️ Procesando...</button>`;
                } else if (link.state === 'completed') {
                    step3Btn = `<button class="process-badge save" onclick="downloadFile(${link.id})">💾 Guardar</button>`;
                } else if (link.state === 'error') {
                    step3Btn = `<button class="process-badge error" onclick="retryLink(${link.id})">🔄 Reintentar</button>`;
                }

                let vidQualsData = [];
                const platName = link.plat.name;

                if (platName === 'TikTok' || platName === 'Instagram') {
                    vidQualsData = [{ label: "Perfeccionado (HD)", value: "1080p" }];
                } else if (platName === 'Facebook') {
                    vidQualsData = [
                        { label: "HD (Definición alta)", value: "1080p" },
                        { label: "SD (Definición estándar)", value: "480p" }
                    ];
                } else if (platName === 'X' || platName === 'YouTube') {
                    vidQualsData = [
                        { label: "1080p", value: "1080p" },
                        { label: "720p", value: "720p" },
                        { label: "480p", value: "480p" },
                        { label: "360p", value: "360p" },
                        { label: "240p", value: "240p" },
                        { label: "144p", value: "144p" }
                    ];
                } else {
                    vidQualsData = [
                        { label: "1080p", value: "1080p" },
                        { label: "720p", value: "720p" },
                        { label: "480p", value: "480p" },
                        { label: "360p", value: "360p" }
                    ];
                }

                if (!link.vidQuality) link.vidQuality = vidQualsData[0];

                const audQualsData = [
                    { label: "320 Kbps", value: "320 Kbps" },
                    { label: "256 Kbps", value: "256 Kbps" },
                    { label: "128 Kbps", value: "128 Kbps" }
                ];

                if (!link.audQuality) link.audQuality = audQualsData[0];

                const latestLog = link.logs[link.logs.length - 1];
                const logEntries = link.logs.map(l => `<div class="log-entry">${l}</div>`).join('');

                const durationBadge = link.duration ? `<div class="duration-badge">${link.duration}</div>` : "";

                container.innerHTML += `
                    <div class="card" data-id="${link.id}">
                        <div class="thumb-col">
                            <img src="${link.thumb}" alt="Thumbnail" referrerpolicy="no-referrer">
                            ${durationBadge}
                        </div>
                        <div class="info-col">
                            <div class="platform-tag">
                                ${link.plat.icon.startsWith('http') ? `<img src="${link.plat.icon}" class="platform-logo" referrerpolicy="no-referrer" alt="logo">` : link.plat.icon}
                                <span class="${link.plat.textClass}">${link.plat.name}</span>
                            </div>
                            <div class="title">${link.title}</div>
                            <a href="${link.url}" target="_blank" class="url ${link.plat.class}">${link.url}</a>
                        </div>
                        <div class="logs-wrapper ${link.state === 'completed' ? 'is-completed' : ''}">
                            ${link.infoError ? `<button class="btn-refresh-info" onclick="fetchLinkInfo(${link.id})" title="Reintentar extraer información">🔄</button>` : ''}
                            <details>
                                <summary>${latestLog}</summary>
                                <div class="logs-content">${logEntries}</div>
                            </details>
                        </div>
                        <div class="controls-col">
                            <div class="radio-group">
                                <div class="option-row ${link.format === 'Video' && !link.isNewSelection ? 'deployed' : ''}" data-type="Video">
                                    <label>
                                        <span class="radio-icon">🔴</span>
                                        <span class="radio-text">Video</span>
                                        <span class="radio-ext">MP4</span>
                                        <input type="radio" name="fmt_${link.id}" value="Video" ${link.format === 'Video' ? 'checked' : ''} onchange="toggleFormat(${link.id}, 'Video')">
                                    </label>
                                    <div class="ladder-step step-1">
                                        <div class="custom-dropdown ${vidQualsData.length === 1 ? 'no-arrow' : ''}" id="dropdown_v_${link.id}">
                                            <div class="dropdown-trigger" ${vidQualsData.length > 1 ? `onclick="toggleDropdown(${link.id}, 'Video')"` : ''} data-value="${link.vidQuality.value}">${link.vidQuality.label}</div>
                                            ${vidQualsData.length > 1 ? `
                                            <div class="dropdown-menu">
                                                ${vidQualsData.map(q => `<div class="dropdown-item" onclick="selectOption(${link.id}, 'Video', '${q.label}', '${q.value}')">${q.label}</div>`).join('')}
                                            </div>
                                            ` : ''}
                                        </div>
                                        <div class="ladder-step step-2">
                                            ${link.rawDuration ? `<div class="size-badge" id="size_badge_Video_${link.id}">${estimateSize(link.rawDuration, 'Video', link.vidQuality.value, link.plat.name)}</div>` : ''}
                                            <div class="ladder-step step-3">
                                                ${step3Btn}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="option-row ${link.format === 'Audio' && !link.isNewSelection ? 'deployed' : ''}" data-type="Audio">
                                    <label>
                                        <span class="radio-icon">⚪</span>
                                        <span class="radio-text">Audio</span>
                                        <span class="radio-ext">MP3</span>
                                        <input type="radio" name="fmt_${link.id}" value="Audio" ${link.format === 'Audio' ? 'checked' : ''} onchange="toggleFormat(${link.id}, 'Audio')">
                                    </label>
                                    <div class="ladder-step step-1">
                                        <div class="custom-dropdown" id="dropdown_a_${link.id}">
                                            <div class="dropdown-trigger" onclick="toggleDropdown(${link.id}, 'Audio')" data-value="${link.audQuality.value}">${link.audQuality.label}</div>
                                            <div class="dropdown-menu">
                                                ${audQualsData.map(q => `<div class="dropdown-item" onclick="selectOption(${link.id}, 'Audio', '${q.label}', '${q.value}')">${q.label}</div>`).join('')}
                                            </div>
                                        </div>
                                        <div class="ladder-step step-2">
                                            ${link.rawDuration ? `<div class="size-badge" id="size_badge_Audio_${link.id}">${estimateSize(link.rawDuration, 'Audio', link.audQuality.value, link.plat.name)}</div>` : ''}
                                            <div class="ladder-step step-3">
                                                ${step3Btn}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="action-col">
                            ${actionBtn}
                        </div>
                    </div>
                `;
            });

            // Trigger solo para la nueva selección
            setTimeout(() => {
                links.forEach(link => {
                    if (link.isNewSelection && link.format) {
                        const el = document.querySelector(`.card[data-id="${link.id}"] .option-row[data-type="${link.format}"]`);
                        if (el) {
                            el.classList.add('deployed');
                            link.isNewSelection = false; // Consumir la marca
                        }
                    }
                });
            }, 50);
        }

        function toggleDropdown(id, type) {
            const dropdown = document.querySelector(`.card[data-id="${id}"] .option-row[data-type="${type}"] .custom-dropdown`);
            const card = dropdown.closest('.card');

            // Cerrar otros
            document.querySelectorAll('.custom-dropdown').forEach(d => {
                if (d !== dropdown) d.classList.remove('open');
            });
            document.querySelectorAll('.card').forEach(c => {
                if (c !== card) c.style.zIndex = "1";
            });

            dropdown.classList.toggle('open');
            card.style.zIndex = dropdown.classList.contains('open') ? "9999" : "1";
        }

        function selectOption(id, type, label, value) {
            const link = links.find(l => l.id === id);
            if (!link) return;

            if (type === 'Video') {
                link.vidQuality = { label: label, value: value };
            } else {
                link.audQuality = { label: label, value: value };
            }

            if (link.state === 'completed' || link.state === 'error') {
                link.state = 'ready';
                link.downloadUrl = null;
            }

            renderLinks();
        }

        // Cerrar dropdowns al hacer clic fuera
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-dropdown')) {
                document.querySelectorAll('.custom-dropdown').forEach(d => d.classList.remove('open'));
                document.querySelectorAll('.card').forEach(c => c.style.zIndex = "1");
            }
        });
    </script>
</body>

</html>
